name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  fmt:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Prettier Check
        run: |
          npm install prettier prettier-plugin-motoko --no-save
          npx prettier --plugin prettier-plugin-motoko --check '**/*.{mo,json,md,ts,tsx,js}'

  build:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4

      - name: Install mops
        uses: ZenVoich/setup-mops@v1.3.1

      - name: Install icp
        run: |
          npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Start local network
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            icp network start -d && break
            echo "icp network start failed (attempt $i), retrying in 10s..."
            sleep 10
          done

      - name: Build canisters and prepare tests
        run: |
          npm i
          npm run create

      - name: Run mops tests
        run: |
          mops test

      - name: Run tests
        run: |
          npm run test

      - name: Stop local network
        run: icp network stop

      - name: Make bin directory
        run: mkdir -p /home/runner/bin

      - name: Get didc
        run: |
          release=2025-07-29
          curl -fsSL https://github.com/dfinity/candid/releases/download/$release/didc-linux64 > /home/runner/bin/didc
          chmod +x /home/runner/bin/didc
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Check implementation against public did file
        run: didc check .mops/.build/icrc1_auction_development.did did/icrc1_auction.did

      - name: Check public did file against icrc84 standard
        run: didc check did/icrc1_auction.did $(ls -d .mops/icrc-84*)/icrc-84.did
